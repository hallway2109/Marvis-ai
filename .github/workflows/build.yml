name: Build Marvis APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Add API key (repo secret GEMINI_API_KEY)
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: marvis-debug-apk, path: app/build/outputs/apk/debug/*.apk }
